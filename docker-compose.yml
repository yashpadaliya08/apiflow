services:
  apiflow-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: apiflow-studio:latest
    container_name: apiflow-studio
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ALLOWED_PROXY_DOMAINS=${ALLOWED_PROXY_DOMAINS:-api.enterprise.dev,api.example.com}
      - ADMIN_KEY=${ADMIN_KEY:-}
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
